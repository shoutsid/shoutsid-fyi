name: Feature request
description: Suggest a change to the site, tooling or documentation. Read CONTRIBUTING.md first.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        This is a personal portfolio with deliberate constraints: no database, no
        write path, no comments, no analytics and no contact form. Feature requests
        that add one of those will usually be declined. Explain the problem first;
        the implementation is secondary.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the reader, operator or contributor problem, not only the proposed change.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Note any effect on the documented constraints.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including doing nothing.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: I have read CONTRIBUTING.md and the architecture documentation.
          required: true
        - label: This proposal does not add a database, write path, user-submitted content or third-party tracking.
          required: true
        - label: This is not a security vulnerability.
          required: true
