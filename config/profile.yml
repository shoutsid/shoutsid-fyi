# Shown on the About page under "How I work". Each line is a claim about
# practice, not a claim about outcomes.
principles:
  - title: Boundaries before services
    body: >
      A modular monolith with real domain boundaries — enforced by the build,
      not by convention — is usually the cheaper place to start than a network
      of services. Split when the boundary has earned it.
  - title: Evidence over assertion
    body: >
      Generated or hand-written, a change is only as good as the test that
      fails without it. I would rather record a reproducible result than a
      confident one.
  - title: AI, held to evidence
    body: >
      A model's output is a proposal, not a result. I build agent and AI tooling
      around tests, independent verification and recorded evidence, so a change
      is accepted because it passed something rather than because a model said
      it did.
  - title: Upgrades are maintenance, not projects
    body: >
      Keeping a long-lived Rails application upgradeable is continuous work:
      dependency hygiene, a suite that catches regressions, and CI that makes
      the change cheap to prove. Left alone, it becomes a rewrite.
  - title: Boring infrastructure
    body: >
      Containers that are pinned, unprivileged and read-only; one public path
      in through a tunnel; logs that are bounded. The goal is that nothing
      about running it is interesting.
