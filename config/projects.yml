# Every project card, project page and homepage section renders from here.
#
# `status` is one of: live | public | research | in-progress (see
# lib/content.rb STATUSES — the badge label and the caveat under it are chosen
# from the same value, so a research project cannot be presented as shipped).
#
# `highlights` are capabilities or engineering facts, not outcomes. No user
# numbers, revenue or benchmarks appear unless they are reproducible and
# published — see docs/editorial.md.

projects:
  - slug: rails-modular-monolith
    title: Rails modular monolith with DDD
    status: public
    featured: true
    section: main
    year: "2024"
    tagline: Packwerk boundaries, a transactional outbox and a Kafka consumer in Rails.
    summary: >
      A worked example of splitting a Rails application into Packwerk-bounded
      components, with a transactional outbox so an event written in the same
      transaction as the data is never lost before it is published. Debezium
      tails the outbox table through Kafka Connect, a Karafka consumer processes
      the event with a dead-letter queue, and the AI component answers through a
      local Ollama model and keeps its own database.
    highlights:
      - Domain boundaries enforced by Packwerk rather than by folder naming.
      - A transactional outbox so an event cannot be lost between commit and publish.
      - Kafka Connect tailing the outbox table and pushing events onto Kafka.
      - A Karafka consumer for the AI component's outbox events, with a dead-letter queue.
      - The AI component keeps its own database through Rails' multiple-database connection.
      - A generative-AI component wired to a local Ollama model.
    screenshots:
      - label: The reference implementation's four-domain shape, which the Rails port starts from.
        path: /diagrams/rails-outbox.svg
        alt: "A diagram of the reference implementation's four domains, each with its own database; a write that lands in a transactional outbox table inside the same transaction; Kafka Connect tailing that table; and events published to Kafka for the other domains to consume. The Rails port implements the Packwerk boundaries, the outbox and the Kafka path, but not the per-domain databases or the reference's sagas."
    notes: >
      A demonstration project, written up in the same spirit as the
      architecture direction advocated at City Electrical Factors, described
      in the experience history on the About page. A partial port: the Packwerk
      boundaries, outbox, Kafka path and Karafka consumer are implemented; the
      reference's per-domain databases and saga choreography are not.
    stack: [Ruby on Rails, Packwerk, Kafka, Karafka, Ollama, DDD]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/rails_modular_monolith
      - label: Reference implementation it was informed by
        url: https://github.com/rootstrap/rails-modular-monolith-with-ddd/tree/saga-with-outbox-component

  - slug: webcap
    title: Webcap
    status: live
    featured: true
    section: main
    year: "2026 — present"
    tagline: Developer API for web capture, extraction and monitoring.
    summary: >
      An HTTP API for capturing web pages as screenshots or documents,
      extracting structured content, and watching pages for changes. Built to be
      called from scripts and software agents, with a public free preview and
      pay-per-call access rather than a required account.
    highlights:
      - Capture a page as PNG, JPEG or PDF.
      - Full-page scroll capture as WebM video, for demos and archiving.
      - Extract titles, headings, links, paragraphs and Markdown into structured responses.
      - Batch extraction across multiple URLs.
      - SEO and link-health audit per URL.
      - Schedule repeated captures or extractions and alert on change via webhook.
      - Pay-per-call access using the x402 flow, settled in USDC on Base.
    # The response below was called live before publishing, and the word count
    # is what the service actually returned. It previously read 123, which the
    # running service has never returned — a number nobody could reproduce, on
    # a site whose argument is that its claims can be. Abridged: the real body
    # also carries the full markdown, headings, links and allowance headers.
    demo:
      title: The free preview endpoint, called live (abridged)
      request: curl "https://webcap.shoutsid.fyi/v1/extract/preview?url=https://example.com/"
      response: |-
        200 {"url":"https://example.com/",
             "preview":{"title":"Example Domain",
                        "wordCount":25,
                        "markdown":"This domain is for use in documentation examples..."},
             "truncated":true,"cached":true}
    screenshots:
      - label: The public landing page, captured from the running service.
        path: /screenshots/webcap.png
        alt: "The webcap landing page: a headline reading 'Screenshot any URL', a curl example, a feature grid, and per-call pricing."
    notes: >
      Deployed and publicly reachable. The public site documents the endpoints
      and the payment flow; this page describes the service rather than
      claiming customers or usage.
    stack: [TypeScript, Node.js, Fastify, Playwright, SQLite, x402]
    links:
      - label: webcap.shoutsid.fyi
        url: https://webcap.shoutsid.fyi/
      - label: Run the free preview (returns JSON)
        url: https://webcap.shoutsid.fyi/v1/extract/preview?url=https://example.com/
      # Repointed from /docs, which 404s. The service never served that path:
      # its own landing page links to /quickstart and /openapi.json, and both
      # answer 200. A dead link on a card whose status is `live` is the one
      # claim nothing here could check for itself, which is why `bin/site
      # links` now exists.
      - label: Quick start and API reference
        url: https://webcap.shoutsid.fyi/quickstart
      - label: OpenAPI schema
        url: https://webcap.shoutsid.fyi/openapi.json

  - slug: agents-fyi
    title: agents.shoutsid.fyi
    status: live
    featured: true
    section: main
    year: "2026 — present"
    tagline: A shared knowledge exchange for agents, where a claim is only verified when someone else reproduces it.
    summary: >
      A service holding the breaking changes, undocumented errors and signature
      surprises that release notes do not cover, together with the fix that
      actually worked. Reports are filed by agents and operators, and one is
      only marked resolved_verified once other operators independently
      reproduce it, so the confirmation count has evidence under it rather than
      being a number. It is a Rails application: the domain code is split into
      packages whose boundaries the build enforces, and the same service answers
      what a Rails upgrade crosses and which call sites a release breaks in the
      caller's own files.
    highlights:
      - "Verification is executable: two services run beside the miner and execute a claim against the releases it is about, recording what the interpreter said."
      - GET /reports/{id} returns that recorded evidence alongside the report itself.
      - Clients are not peers — the miner has no database password and no route to the database.
      - The corpus is grown by executing one release of a package against the next and filing what is new, rather than by scraping release notes.
      - GET /rails/upgrade plans a move from the documented ladder plus what the corpus has actually observed; POST /rails/scan finds the call sites a release breaks in the caller's own files.
      - An MCP server over stdio and a hosted Streamable HTTP endpoint, so agents can search, read, file and verify reports as tools.
      - Published through a Cloudflare Tunnel from a host with no inbound ports and no public IP.
    demo:
      title: The served root, from the running service (abridged)
      request: curl -s https://agents.shoutsid.fyi/
      response: |
        {"service":"agents.shoutsid.fyi","version":"1.0.0",
         "endpoints":{"search":"GET /reports/search?q=",
                      "report":"GET /reports/{id}",
                      "verify":"POST /reports/{id}/verify"}}
    notes: >
      Deployed and publicly reachable. Described as a knowledge exchange rather
      than a corpus with a population: the verification rule is the claim, and
      what is not claimed is a user count or a coverage figure.
    stack: [Ruby on Rails, Packwerk, PostgreSQL, Docker Compose, Cloudflare Tunnel, MCP]
    links:
      - label: agents.shoutsid.fyi
        url: https://agents.shoutsid.fyi/

  # A public repository rather than a deployed service, and it sits in the main
  # section because it is the pillar the AI differentiator is argued on: the
  # claim it makes is the verification model, not a model's own report of
  # success. Described from the project's README and architecture notes, and
  # making no benchmark or quality claim of its own.
  - slug: local-coder
    title: Local coding-agent infrastructure
    status: public
    featured: true
    section: main
    year: "2026"
    tagline: A fully local coding agent where the tests, not the model, decide whether a change passed.
    summary: >
      A local-first coding-agent stack sized for a consumer GPU and 8 GiB of
      memory: role-separated agents for exploration, planning, implementation,
      repair and review, run one at a time through stable logical model routes.
      Each run happens in an isolated Git worktree and is preserved for review,
      and a trusted evaluator — not the model — decides whether the change is
      acceptable.
    highlights:
      - "A fully local stack — llama.cpp behind stable logical routes (fast, plan, review, reason) — sized for a 6 GB-class GPU and 8 GiB of system memory."
      - Role-separated agents for exploration, planning, implementation, repair and review, rather than one general prompt.
      - Isolated Git worktrees per run, preserved for review; the runtime never commits, merges or pushes.
      - "Black, Flake8, pytest, protected tests and git diff --check are authoritative — the model does not decide whether its own changes pass."
      - SQLite records runs, traces, artifacts, verification and decisions, so what happened can be re-read rather than trusted.
      - Prompt changes follow an audited lifecycle with a holdout gate and an explicit activation decision the candidate cannot make for itself.
    notes: >
      Independent work with public source, described at the level of the
      architecture and the verification model. No benchmark, usage or code
      quality claim is made here, and none of it is presented as employment.
    stack: [Python, llama.cpp, LiteLLM, DSPy, smolagents, SQLite, Git worktrees]
    screenshots:
      - label: The stack and its trust boundary, drawn from the project's own architecture notes.
        path: /diagrams/local-coder.svg
        alt: "A layered diagram: llama.cpp serving one local model profile at a time; a model service manager switching between profiles; LiteLLM exposing stable fast, plan, review and reason routes; role-separated explorer, planner, implementer, repairer and reviewer agents; a native editor applying validated replacements; an isolated Git worktree per run; and a trusted evaluator running Black, Flake8, pytest and protected tests, with a SQLite store recording runs, artifacts and verification."
    links:
      - label: GitHub
        url: https://github.com/shoutsid-lab/local-coder

  - slug: act
    title: Adaptive Computational Topology (ACT)
    status: research
    featured: true
    section: systems
    year: "2026 — present"
    tagline: Can a network's topology adapt during pretraining?
    summary: >
      An experimental pretraining framework investigating whether jointly
      adapting model weights and computational topology during pretraining can
      improve the trade-off between model capability and compute cost, compared
      with fixed architectures of comparable capacity.
    highlights:
      - A research hypothesis, explicitly not a demonstrated result — the joint topology question is still open, while the later architecture-search phase reports a positive result on a narrower question.
      - Pre-registered studies with declared decision rules, rather than results read after the fact.
      - Compute-aware topology search rather than unconstrained growth.
      - Model-importance signals — routing load, gradient norms, Fisher approximations and causal ablation — driving where topology may change.
      - "Machine-checked claims: a verification script audits the report against its committed artifacts, and the suite pins each arm's recorded result against its own summary, so a claim that drifts from the record fails the build."
      - Control and null arms a result has to beat to count, including a do-nothing clause.
    notes: >
      Independent research with public source, described at the level of the
      question, the method and the public record. Reported negative and null
      outcomes are recorded as they stand rather than rounded toward the
      hypothesis, and the campaign that would settle the central question
      remains incomplete with no verdict.
    stack: [Python, PyTorch, topology search, experiment tracking, XLA]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/act-lab

  # Research rather than public. The source is readable, but the question the
  # project is about — whether complexity or replication emerges — has not been
  # demonstrated, and docs/editorial.md calls that an ongoing investigation
  # whose result must not be read as shown. So it belongs in the research
  # section beside ACT, and the badge says so on the card itself.
  - slug: evo16
    title: evo16
    status: research
    featured: true
    section: systems
    year: "2026"
    tagline: A deterministic artificial-life simulation with reproducible experiments.
    summary: >
      A virtual-machine-based artificial-life simulation with reproducible
      experimental tooling and a browser-based WebGL visualisation. The value is
      in the determinism and the controls, not in the pixels: the same seed
      produces the same run, so a claim about what evolved can be re-checked.
    highlights:
      - A small virtual machine with a defined instruction set and world model.
      - Deterministic execution — a seed reproduces a run exactly.
      - Reproducible experiment tooling with explicit controls.
      - A WebGL visualisation in the browser for inspecting a run.
    notes: >
      Findings are reported conservatively. Spontaneous replication has not
      been demonstrated, and visual complexity is not treated as evidence of
      it.
    stack: [C, Python, WebGL, simulation, reproducible experiments]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/evo16

  - slug: planetary-matrix
    title: Planetary Matrix
    status: public
    featured: true
    section: systems
    year: "2026 — present"
    tagline: A headless Earth-scale simulation core, partitioned into shards that do not share memory.
    summary: >
      A simulation core that partitions the planet into S2 grid cells and treats
      each level-13 cell as an independent shard of a sharded key-value store by
      default.
      Neighbouring cells are joined only by a graph of boundary ports, so a cell
      can be evicted from memory while its neighbour keeps running against a
      proxy horizon. A graphical client is deliberately not part of the
      simulation: it reads the state of the cell around the player over HTTP and
      draws it.
    highlights:
      - S2 cell-id implemented in-tree rather than linked against google/s2geometry, which would pull Abseil and OpenSSL into the build.
      - Cell payloads round-trip through a key-value interface with three backends — an in-memory map, a directory of one file per partition, and a clustered wide-column store over a token ring.
      - "Cross-grid utility flow across an evicted cell, proven by a scenario: the boundary scan marries dangling ports, the source is written down and dropped, and the neighbour still receives labelled synthesised flow."
      - Utilities carry their own units through the flow report, and unserved demand is reported rather than absorbed.
      - An offline build gate (scripts/check.sh) that fetches nothing, so it behaves the same with network egress disabled.
      - A browser viewport against the same data layer, served by a second binary over a recorded HTTP contract.
    demo:
      title: The project's own gate, run on a clean build (abridged)
      request: ./scripts/check.sh
      response: |
        ---- build
        PASS  build
        ---- unit and fixture suite
        PASS  unit and fixture suite
        ---- milestone 2 scenario
          PASS  the boundary scan married the two ports
          PASS  the neighbour still receives, and the flow is labelled synthesised
          PASS  the isolation check passes
        milestone 2: all checks passed
        SKIP  milestone 3 (scripts/serve-check.sh) — needs node, curl and a Chrome
        check.sh: all stages passed
    notes: >
      A work in progress with a deliberate shape. The first three milestones are
      built — the headless sandbox, cross-grid flow, and the browser viewport —
      and later slices build on them: a clustered wide-column store, square
      shards, a 3D client, a clock and event stream, and the property,
      sanitation, transit, market, progression and debt systems. Each is
      demonstrated by a named artifact rather than asserted; the roadmap marks
      its own open items as open, and findings are stated as what the checks
      currently pass, not as a claim about the simulation's fidelity.
    stack: [C++, CMake, Flecs ECS, doctest, S2 geometry, sharded key-value store, WebGL]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/planetary-matrix

  - slug: townhall
    title: Townhall
    status: public
