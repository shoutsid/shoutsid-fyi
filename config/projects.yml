# Every project card, project page and homepage section renders from here.
#
# Order within a section is the order it renders, and the main section leads
# with the Ruby work: the Rails case study, then the Rails service and its Ruby
# clients. The TypeScript service follows them, because this portfolio is
# pitched at Ruby and Rails roles.
#
# `status` is one of: live | public | research | in-progress (see
# lib/content.rb STATUSES — the badge label and the caveat under it are chosen
# from the same value, so a research project cannot be presented as shipped).
#
# `highlights` are capabilities or engineering facts, not outcomes. No user
# numbers, revenue or benchmarks appear unless they are reproducible and
# published — see docs/editorial.md.

projects:
  - slug: rails-modular-monolith
    title: Rails modular monolith with DDD
    status: public
    featured: true
    section: main
    year: "2024"
    tagline: Packwerk boundaries, a transactional outbox and a Kafka consumer in Rails.
    summary: >
      A worked example of splitting a Rails application into Packwerk-bounded
      components, with a transactional outbox so an event written in the same
      transaction as the data is never lost before it is published. Debezium
      tails the outbox table through Kafka Connect, a Karafka consumer processes
      the event with a dead-letter queue, and the AI component answers through a
      local Ollama model and keeps its own database.
    highlights:
      - Domain boundaries enforced by Packwerk rather than by folder naming.
      - A transactional outbox so an event cannot be lost between commit and publish.
      - Kafka Connect tailing the outbox table and pushing events onto Kafka.
      - A Karafka consumer for the AI component's outbox events, with a dead-letter queue.
      - The AI component keeps its own database through Rails' multiple-database connection.
      - A generative-AI component wired to a local Ollama model.
    screenshots:
      - label: The reference implementation's four-domain shape, which the Rails port starts from.
        path: /diagrams/rails-outbox.svg
        alt: "A diagram of the reference implementation's four domains, each with its own database; a write that lands in a transactional outbox table inside the same transaction; Kafka Connect tailing that table; and events published to Kafka for the other domains to consume. The Rails port implements the Packwerk boundaries, the outbox and the Kafka path, but not the per-domain databases or the reference's sagas."
    notes: >
      A demonstration project, written up in the same spirit as the
      architecture direction advocated at City Electrical Factors, described
      in the experience history on the About page. A partial port: the Packwerk
      boundaries, outbox, Kafka path and Karafka consumer are implemented; the
      reference's per-domain databases and saga choreography are not.
    stack: [Ruby on Rails, Packwerk, Kafka, Karafka, Ollama, DDD]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/rails_modular_monolith
      - label: Reference implementation it was informed by
        url: https://github.com/rootstrap/rails-modular-monolith-with-ddd/tree/saga-with-outbox-component
    posts:
      - boundaries-in-a-rails-app-nobody-is-rewriting
      - the-outbox-is-a-table-not-a-library

  - slug: agents-fyi
    title: agents.shoutsid.fyi
    status: live
    featured: true
    section: main
    year: "2026 — present"
    tagline: A shared knowledge exchange for agents, where a claim is only verified when someone else reproduces it.
    summary: >
      A Rails service holding the breaking changes, undocumented errors and
      signature surprises that release notes do not cover, together with the fix
      that actually worked. Reports are filed by agents and operators, and one
      is only marked resolved_verified once other operators independently
      reproduce it, so the confirmation count has evidence under it rather than
      being a number. The service also holds the Rails upgrade ladder and the
      mining queue; the miner that grows the corpus and the upgrader that walks
      the ladder are separate repositories that reach this API as ordinary
      callers.
    highlights:
      - "Verification is executable: every confirmation is an execution, returned with the environment it ran in and the evidence the operator gave."
      - Reports declare what they are about — a package, a hosted service, a platform or the agent harness itself.
      - "The corpus is grown by clients, not by the service: the service decides what is new and what a reading means, and has no route to a package index."
      - GET /api/rails/upgrade plans a move from the documented ladder plus what the corpus has actually observed; POST /api/rails/scan finds the call sites a release breaks in the caller's own files.
      - An MCP server over stdio and a hosted Streamable HTTP endpoint, so agents can search, read, file and verify reports as tools.
      - Published through a Cloudflare Tunnel from a host with no inbound ports and no public IP; the database publishes no port and the clients hold no database password.
    demo:
      # The root served this JSON until the service grew a portal; it now
      # redirects to a sign-in page and the endpoint map lives at /api. The old
      # demo named a command that no longer produces its own output, which is
      # exactly what `bin/site links` cannot see.
      title: The service index, called live (abridged)
      request: curl -s https://agents.shoutsid.fyi/api
      response: |-
        200 {"service":"agents.shoutsid.fyi","version":"1.0.0","environment":"production",
             "endpoints":{"health":"/api/health","ready":"/api/ready",
                          "register":"POST /api/operators/register",
                          "submit":"POST /api/reports",
                          "search":"GET /api/reports/search?q=",
                          "report":"GET /api/reports/{id}",
                          "verify":"POST /api/reports/{id}/verify"}}
    screenshots:
      - label: The service, its clients and the one path in. An authored diagram.
        path: /diagrams/agents-fyi-system.svg
        alt: "A diagram of the agents-fyi deployment: the Cloudflare edge and an outbound-only tunnel reach a Rails service with one database; a second ingress rule reaches an MCP endpoint; PostgreSQL publishes no port; and four clients — the miner, two verifiers and the upgrader — reach the service's public API with operator keys, have the egress the service does not, and have no database password or route to the database."
    notes: >
      Deployed and publicly reachable. The service holds the corpus and the
      ladder; the miner and the upgrader are separate repositories, images and
      licences, and neither is part of the service's build. Described as a
      knowledge exchange rather than a corpus with a population: the
      verification rule is the claim, and what is not claimed is a user count or
      a coverage figure.
    stack: [Ruby on Rails 8.1, Packwerk, PostgreSQL, Docker Compose, Cloudflare Tunnel, MCP]
    links:
      - label: agents.shoutsid.fyi
        url: https://agents.shoutsid.fyi/
      - label: The miner that grows the corpus
        url: /work/miner
      - label: The upgrader that walks the ladder
        url: /work/upgrader
    posts:
      - a-bug-report-is-a-differential
      - what-an-mcp-server-owes-a-model
      - walking-rails-from-4-0-to-8-1
      - porting-a-live-service-one-route-at-a-time
      - a-client-is-a-caller-not-a-component

  # The two clients, released as their own repositories. They sit after the
  # service they call rather than beside it: the card order tells the system's
  # story — the corpus and the ladder, then the miner that grows one and the
  # upgrader that walks the other. Webcap follows them rather than leading the
  # grid: it is a deployed service, and TypeScript, and the ordering here leads
  # with the Ruby work. Both clients are public to read and proprietary:
  # "Public repo" is the status label's meaning (source on GitHub and readable)
  # and the notes carry the licence, because the two are easy to conflate.
  - slug: miner
    title: agents-fyi miner
    status: public
    featured: false
    section: main
    year: "2026"
    tagline: Finds real failures by executing one release of a package against the next.
    summary: >
      A Ruby client that installs two releases of a package, asks each what its
      public callables accept, and executes the same call against both. When the
      older release accepts the call and the newer one refuses it by name, the
      interpreter's own traceback is filed — but only after the corpus says the
      finding is new. It also answers open reports with an executed fix and
      confirms other operators' reports by reproducing them, as one of two
      independent methods.
    highlights:
      - "A finding is arithmetic: the same call was executed against both releases, and the traceback filed with the report is the interpreter's output from the refusing run."
      - "mine needs no corpus and files nothing; publish asks the service whether each finding is new, and --dry-run asks without writing."
      - Findings are clustered by mechanism, because one upstream decision can rename an argument across eleven callables.
      - A replacement argument is executed before it is offered; a rename is only claimed when a candidate is built from every word of the old name, and a tie is refused.
      - "The two verifiers run the same image under their own accounts: one executes the call sites the report names, the other re-derives the claim from the two releases and ignores the report's prose."
      - "The ledger is state, not a cache: a pair that failed is retried, a pair that was examined is not, and an unbuildable release is stamped with the interpreter and whether a compiler was present."
    demo:
      title: A differential, run on one package
      request: ./bin/agents-fyi-miner mine --package httpx --from 0.27.2 --to 0.28.1
      response: |-
        httpx 0.28.1: httpx 0.28.1 removed the app= argument (2 call site(s), 0 repaired)
        httpx 0.28.1: httpx 0.28.1 renamed proxies= to proxy= (11 call site(s), 11 repaired)
        httpx 0.28.1: httpx 0.28.1 removed the http2= argument (1 call site(s), 0 repaired)
        httpx 0.28.1: httpx 0.28.1 removed the cert= argument (9 call site(s), 0 repaired)
        found 4 finding(s); nothing was filed
    notes: >
      Public to read and proprietary: the source is published so operators and
      reviewers can read the client, not as open source. Execution proves a
      reference, not behaviour — a release that changes what a call does without
      changing its signature is invisible here, and a value a release rejects is
      not what this finds. The two confirmations are independent executions by
      two methods on one machine, not two parties.
    stack: [Ruby, Python, PyPI, RubyGems, Docker]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/miner
      - label: The service it files into
        url: /work/agents-fyi
      - label: Design notes, with the measurements that changed it
        url: https://github.com/shoutsid/miner/blob/main/docs/design-notes.md
    posts:
      - a-bug-report-is-a-differential
      - the-corpus-stopped-growing
      - a-wheel-is-an-artifact-an-environment-is-evidence

  - slug: upgrader
    title: agents-fyi upgrader
    status: public
    featured: true
    section: main
    year: "2026"
    tagline: Moves a Rails application one release at a time, and records what the move cost.
    summary: >
      A Ruby client of the agents-fyi service that reads an application's
      Gemfile.lock, asks the service what a move crosses, and applies only what
      the service calls mechanical. It runs the application's suite before and
      after the move on a working copy it owns, and records the patch, every
      command with its exit code, the interpreter it ran on and the decisions a
      machine may not make. The ladder — what each Rails release changed and
      which of those changes a machine may make — lives in the service, not in
      the client.
    highlights:
      - plan splits a move into mechanical changes and decisions for a person; step executes one rung and never writes to the caller's own repository.
      - "The client keeps no copy of Rails' release order, and there is no default service: a walker that quietly used its author's deployment would answer from a corpus the caller did not choose."
      - A pass is a suite green before the move and green after it, on a named interpreter, with the baseline, the commands, their exit codes and the patch in the record.
      - "Exit status is part of the contract: 0 for a plan or a pass, 2 for a refusal about the move, 1 for a failure about the repository, the service or the machine. unverified exits 1."
      - preview renders the review brief a stored record would publish, with no checkout, token or push; republish re-renders delivered pull requests from their records.
      - "The repository is public to read and proprietary: no use, copying or redistribution is licensed."
    demo:
      title: A plan for a public Rails application, called live (abridged)
      request: ./bin/agents-fyi-upgrader plan --repo https://github.com/shoutsid/biddingapp --to 7.1.0 --api https://agents.shoutsid.fyi
      response: |-
        https://github.com/shoutsid/biddingapp at eaa823724dd1c074550aa5dc887f0b7ccd1f64eb
        on Rails 4.0.0.rc1, read from `rails` in Gemfile.lock
        Ruby floor this move needs: 2.7.0 (Rails 7.0.0 requires it; per step below)
        9 step(s): Rails 4.1 -> Rails 4.2 -> Rails 5.0 -> Rails 5.1 -> Rails 5.2 -> Rails 6.0 -> Rails 6.1 -> Rails 7.0 -> Rails 7.1

        == Rails 4.1 (4.0.0 -> 4.1.0)
           requires Ruby 1.9.3 or newer
           10 documented change(s): 0 a machine can apply, 10 need a decision
           decide: render :text -> render plain: / render html: / render body: (renamed; 4.0 → 4.1, Rendering content from string) [raises by your target]
           …
           executed here: 0 — nothing this corpus executed falls inside this step's window, so the list above is Rails' own guide rather than a finding

        == Rails 5.0 (4.2.0 -> 5.0.0)
           requires Ruby 2.2.2 or newer
           17 documented change(s): 5 a machine can apply, 12 need a decision
           apply:  before_filter -> before_action (renamed; 5.0, controller filters) [raises by your target]
           …
           executed here: 0 — nothing this corpus executed falls inside this step's window, so the list above is Rails' own guide rather than a finding

        == Rails 7.1 (7.0.0 -> 7.1.0)
           …
    notes: >
      Public to read and proprietary. A pass says the application's suite was
      green before the move and green after it, on the machine the step ran on;
      it is not independent verification, and it is not a statement that the
      move is correct for every caller.
    stack: [Ruby, Rails, Docker, Git, GitHub]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/upgrader
      - label: The service its ladder comes from
        url: /work/agents-fyi
      - label: Design notes, including the failures that changed the shape
        url: https://github.com/shoutsid/upgrader/blob/main/docs/design-notes.md
    posts:
      - walking-rails-from-4-0-to-8-1
      - a-client-is-a-caller-not-a-component
      - a-refusal-is-an-output

  - slug: webcap
    title: Webcap
    status: live
    featured: true
    section: main
    year: "2026 — present"
    tagline: Developer API for web capture, extraction and monitoring.
    summary: >
      An HTTP API for capturing web pages as screenshots or documents,
      extracting structured content, and watching pages for changes. Built to be
      called from scripts and software agents, with a public free preview and
      pay-per-call access rather than a required account.
    highlights:
      - Capture a page as PNG, JPEG or PDF.
      - Full-page scroll capture as WebM video, for demos and archiving.
      - Extract titles, headings, links, paragraphs and Markdown into structured responses.
      - Batch extraction across multiple URLs.
      - SEO and link-health audit per URL.
      - Schedule repeated captures or extractions and alert on change via webhook.
      - Pay-per-call access using the x402 flow, settled in USDC on Base.
    # The response below was called live before publishing, and the word count
    # is what the service actually returned. It previously read 123, which the
    # running service has never returned — a number nobody could reproduce, on
    # a site whose argument is that its claims can be. Abridged: the real body
    # also carries the full markdown, headings, links and allowance headers.
    demo:
      title: The free preview endpoint, called live (abridged)
      request: curl "https://webcap.shoutsid.fyi/v1/extract/preview?url=https://example.com/"
      response: |-
        200 {"url":"https://example.com/",
             "preview":{"title":"Example Domain",
                        "wordCount":25,
                        "markdown":"This domain is for use in documentation examples..."},
             "truncated":true,"cached":true}
    screenshots:
      - label: The public landing page, captured from the running service.
        path: /screenshots/webcap.png
        alt: "The webcap landing page: a headline reading 'Screenshot any URL', a curl example, a feature grid, and per-call pricing."
    notes: >
      Deployed and publicly reachable. The public site documents the endpoints
      and the payment flow; this page describes the service rather than
      claiming customers or usage.
    stack: [TypeScript, Node.js, Fastify, Playwright, SQLite, x402]
    links:
      - label: webcap.shoutsid.fyi
        url: https://webcap.shoutsid.fyi/
      - label: Run the free preview (returns JSON)
        url: https://webcap.shoutsid.fyi/v1/extract/preview?url=https://example.com/
      # Repointed from /docs, which 404s. The service never served that path:
      # its own landing page links to /quickstart and /openapi.json, and both
      # answer 200. A dead link on a card whose status is `live` is the one
      # claim nothing here could check for itself, which is why `bin/site
      # links` now exists.
      - label: Quick start and API reference
        url: https://webcap.shoutsid.fyi/quickstart
      - label: OpenAPI schema
        url: https://webcap.shoutsid.fyi/openapi.json
    posts:
      - what-changes-when-your-caller-is-an-agent

  - slug: act
    title: Adaptive Computational Topology (ACT)
    status: research
    featured: true
    section: systems
    year: "2026 — present"
    tagline: Can a network's topology adapt during pretraining?
    summary: >
      An experimental pretraining framework investigating whether jointly
      adapting model weights and computational topology during pretraining can
      improve the trade-off between model capability and compute cost, compared
      with fixed architectures of comparable capacity.
    highlights:
      - A research hypothesis, explicitly not a demonstrated result — the joint topology question is still open, while the later architecture-search phase reports a positive result on a narrower question.
      - Pre-registered studies with declared decision rules, rather than results read after the fact.
      - Compute-aware topology search rather than unconstrained growth.
      - Model-importance signals — routing load, gradient norms, Fisher approximations and causal ablation — driving where topology may change.
      - "Machine-checked claims: a verification script audits the report against its committed artifacts, and the suite pins each arm's recorded result against its own summary, so a claim that drifts from the record fails the build."
      - Control and null arms a result has to beat to count, including a do-nothing clause.
    notes: >
      Independent research with public source, described at the level of the
      question, the method and the public record. Reported negative and null
      outcomes are recorded as they stand rather than rounded toward the
      hypothesis, and the campaign that would settle the central question
      remains incomplete with no verdict.
    stack: [Python, PyTorch, topology search, experiment tracking, XLA]
    links:
      - label: GitHub
        url: https://github.com/shoutsid/act-lab
    posts:
      - an-experiment-that-can-say-no

